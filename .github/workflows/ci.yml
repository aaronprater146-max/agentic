name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest

  smoke:
    name: end-to-end smoke (fake UE5 + UE4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uebuild
        run: pip install .
      - name: Create fake engine installs
        run: |
          python scripts/make_fake_engine.py /tmp/UE_5.3 --version 5.3.2
          python scripts/make_fake_engine.py /tmp/UE_4.27 --version 4.27.2
      - name: Register engines and build matrix
        run: |
          uebuild engines add /tmp/UE_5.3
          uebuild engines add /tmp/UE_4.27
          uebuild engines list
          uebuild plugin info examples/plugins/DummyPlugin/DummyPlugin.uplugin
          cd examples && uebuild matrix --config matrix.example.json --quiet \
            --report-html ../smoke-report.html --report-json ../smoke-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            smoke-report.html
            smoke-report.json
          if-no-files-found: error
