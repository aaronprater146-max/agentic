[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uebuild"
version = "0.1.0"
description = "Headless UE4/UE5 plugin build tool that wraps RunUAT BuildPlugin (UnrealAutomationTool)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "agentic" }]
keywords = ["unreal", "ue4", "ue5", "plugin", "build", "uat", "automation", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/aaronprater146-max/agentic"

[project.scripts]
uebuild = "uebuild.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
